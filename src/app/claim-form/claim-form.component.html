 <div class="claim-form-wrapper" [formGroup]="claimForm">
  <!-- <!- ❌ Close icon (top right corner) -->
  <div class="close-icon" (click)="cancel()">✖</div>

  <div class="grid-row">
    <input type="text" placeholder="Branch Code" formControlName="branchCode" />
    <input type="text" placeholder="POS Code" formControlName="posCode" />
    <input type="text" placeholder="Branch Name" formControlName="branchName" />
  </div>

  <div class="grid-row">
    <input type="text" placeholder="Insurance Company Code" formControlName="insuranceCompanyCode" />
    <input type="text" placeholder="Insurance Company Name" formControlName="insuranceCompanyName" />
    <input type="text" placeholder="Invoice Number" formControlName="invoiceNumber" />
  </div>

  <div class="grid-row">
    <input type="text" placeholder="WIP Number" formControlName="wipNumber" />
  </div>

  <div class="grid-row two-columns">
    <div class="form-field">
      <label>Full Claim Number</label>
      <input type="text" placeholder="// / / /" formControlName="fullClaimNumber" />
    </div>
    <div class="form-field">
      <label>Approval Form</label>
      <input type="text" placeholder="// / / /" formControlName="approvalForm" />
    </div>
  </div>

  <div class="grid-row single-column">
    <div class="form-field">
      <label>Customer Clearance Form</label>
      <input type="text" placeholder="CL/1101/MJ/PCL/23/P/24/4318" formControlName="customerClearanceForm" />
    </div>
  </div>

  <div class="submit-button-wrapper">
    <button class="submit-btn" (click)="submit()" [disabled]="claimForm.invalid">
      Submit
    </button>
    <button class="cancel-btn" (click)="cancel()">Cancel</button>
  </div>
</div>
